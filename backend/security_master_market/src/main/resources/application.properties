spring.application.name=security-market-service
server.port=${MARKET_PORT:8080}
spring.datasource.url=jdbc:mysql://${MARKET_DB_HOST:localhost}:${MARKET_DB_PORT:3306}/security_market_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MARKET_DB_USERNAME:root}
spring.datasource.password=password@1234
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# REST-only market data. Priority is ordered, highest first; demo prices are simulated.
app.market.prices.source-priority=${MARKET_PRICE_SOURCE_PRIORITY:DEMO_SIMULATED}
app.market.prices.max-age=${MARKET_PRICE_MAX_AGE:PT24H}
app.market.seed.enabled=${MARKET_SEED_ENABLED:false}
spring.jackson.deserialization.fail-on-unknown-properties=true
