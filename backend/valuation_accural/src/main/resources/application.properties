spring.application.name=valuation-service
server.port=${VALUATION_PORT:8083}
spring.datasource.url=jdbc:mysql://${VALUATION_DB_HOST:localhost}:${VALUATION_DB_PORT:3306}/valuation_accrual_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${VALUATION_DB_USERNAME:root}
spring.datasource.password=Immunoglobin@812
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
app.auth.issuer=${JWT_ISSUER:securities-lending}
app.auth.jwt-secret=${JWT_SHARED_SECRET}
app.auth.audience=${VALUATION_JWT_AUDIENCE:valuation-service}
app.auth.preview-client-id=${VALUATION_PREVIEW_CLIENT_ID:borrower-service}
app.auth.preview-subject=${VALUATION_PREVIEW_SUBJECT:borrower-service}
app.auth.custodian-client-id=${VALUATION_CUSTODIAN_CLIENT_ID:custodian-service}
app.auth.custodian-subject=${VALUATION_CUSTODIAN_SUBJECT:custodian-service}
app.security-market.base-url=${SECURITY_MARKET_BASE_URL:http://localhost:8080}
app.calculation.max-price-age=${VALUATION_MAX_PRICE_AGE:PT24H}
app.calculation.supported-currencies=${VALUATION_SUPPORTED_CURRENCIES:INR,USD,EUR,GBP}

# Common messaging stays idle until routing and handlers are explicitly configured.
app.messaging.service-name=VALUATION
app.messaging.consumer-name=valuation-messaging-v1
app.messaging.group-id=${KAFKA_GROUP_ID:valuation-messaging-v1}
app.messaging.inbound-topic=${KAFKA_INBOUND_TOPIC:}
app.messaging.dead-letter-topic=${KAFKA_DEAD_LETTER_TOPIC:}
app.messaging.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.messaging.consumer-enabled=${KAFKA_CONSUMER_ENABLED:false}
app.messaging.publisher-enabled=${KAFKA_PUBLISHER_ENABLED:false}
app.messaging.poll-interval-ms=${KAFKA_POLL_INTERVAL_MS:1000}
