spring.application.name=borrower-service
server.port=${BORROWER_PORT:8082}
spring.datasource.url=jdbc:mysql://${BORROWER_DB_HOST:localhost}:${BORROWER_DB_PORT:3306}/borrower_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${BORROWER_DB_USERNAME:root}
spring.datasource.password=Immunoglobin@812
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.structured.format.console=ecs

app.auth.issuer=${JWT_ISSUER:securities-lending}
app.auth.jwt-secret=${JWT_SHARED_SECRET:WjZwTDJ2TjhjUjR5SzFzSDdkRjBtVDl4QTNxVzVqQjhlRzJ1UDZuVjE=}
app.auth.audience=${BORROWER_JWT_AUDIENCE:borrower-service}
app.auth.token-audiences=${BORROWER_TOKEN_AUDIENCES:borrower-service,custodian-service}
app.custodian.base-url=${CUSTODIAN_SERVICE_BASE_URL:http://localhost:8081}
app.custodian.connect-timeout=${CUSTODIAN_CONNECT_TIMEOUT:PT2S}
app.custodian.read-timeout=${CUSTODIAN_READ_TIMEOUT:PT3S}
app.security-market.base-url=${SECURITY_MARKET_BASE_URL:http://localhost:8080}
app.security-market.connect-timeout=${SECURITY_MARKET_CONNECT_TIMEOUT:PT2S}
app.security-market.read-timeout=${SECURITY_MARKET_READ_TIMEOUT:PT3S}

# Common messaging stays idle until routing and handlers are explicitly configured.
app.messaging.service-name=BORROWER
app.messaging.consumer-name=borrower-messaging-v1
app.messaging.group-id=${KAFKA_GROUP_ID:borrower-messaging-v1}
app.messaging.inbound-topic=${KAFKA_INBOUND_TOPIC:sec-lending-responses}
app.messaging.dead-letter-topic=${KAFKA_DEAD_LETTER_TOPIC:sec-lending-responses.DLT}
app.messaging.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.messaging.consumer-enabled=true
app.messaging.publisher-enabled=true
app.messaging.poll-interval-ms=${KAFKA_POLL_INTERVAL_MS:1000}

app.messaging.routes[0].event-type=LOAN_REQUEST_SUBMITTED
