spring.application.name=custodian-service
server.port=${CUSTODIAN_PORT:8081}
spring.datasource.url=jdbc:mysql://${CUSTODIAN_DB_HOST:localhost}:${CUSTODIAN_DB_PORT:3306}/custodian_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${CUSTODIAN_DB_USERNAME:root}
spring.datasource.password=Immunoglobin@812
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
app.auth.issuer=${JWT_ISSUER:securities-lending}
app.auth.jwt-secret=${JWT_SHARED_SECRET:WjZwTDJ2TjhjUjR5SzFzSDdkRjBtVDl4QTNxVzVqQjhlRzJ1UDZuVjE=}
app.auth.audience=${CUSTODIAN_JWT_AUDIENCE:custodian-service}
app.security-market.base-url=${SECURITY_MARKET_BASE_URL:http://localhost:8080}
app.security-market.connect-timeout=${SECURITY_MARKET_CONNECT_TIMEOUT:PT2S}
app.security-market.read-timeout=${SECURITY_MARKET_READ_TIMEOUT:PT3S}
app.valuation.base-url=${VALUATION_SERVICE_BASE_URL:http://localhost:8083}
app.valuation.audience=${VALUATION_JWT_AUDIENCE:valuation-service}
app.approval.max-price-age=${VALUATION_MAX_PRICE_AGE:PT24H}
app.mtm.schedule-enabled=${MTM_SCHEDULE_ENABLED:true}
app.mtm.poll-interval=${MTM_POLL_INTERVAL:PT1M}
app.accrual.schedule-enabled=${FEE_ACCRUAL_SCHEDULE_ENABLED:true}
app.accrual.cron=${FEE_ACCRUAL_CRON:0 10 0 * * *}

# Common messaging stays idle until routing and handlers are explicitly configured.
app.messaging.service-name=CUSTODIAN
app.messaging.consumer-name=custodian-messaging-v1
app.messaging.group-id=${KAFKA_GROUP_ID:custodian-messaging-v1}
app.messaging.inbound-topic=${KAFKA_INBOUND_TOPIC:sec-lending-requests}
app.messaging.dead-letter-topic=${KAFKA_DEAD_LETTER_TOPIC:sec-lending-requests.DLT}
app.messaging.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.messaging.consumer-enabled=true
app.messaging.publisher-enabled=true
app.messaging.poll-interval-ms=${KAFKA_POLL_INTERVAL_MS:1000}
app.messaging.routes[0].event-type=LOAN_REQUEST_SUBMITTED
